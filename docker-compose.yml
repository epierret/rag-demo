services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      # Lié à localhost uniquement : rien n'est exposé directement sur internet
      - "127.0.0.1:4000:4000"
    depends_on:
      - postgres
    restart: unless-stopped

  anythingllm:
    image: mintplexlabs/anythingllm
    environment:
      STORAGE_DIR: /app/server/storage
    volumes:
      # Volume nommé : évite les problèmes de permissions de SQLite avec un dossier monté
      - anythingllm_storage:/app/server/storage
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - litellm
    restart: unless-stopped

  # Monitoring optionnel, hors démarrage par défaut :
  #   docker compose --profile monitoring up -d grafana
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Port 3100 côté hôte : le port 3000 est déjà utilisé par une autre stack Grafana sur la VM
      - "127.0.0.1:3100:3000"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  anythingllm_storage:
  grafana_data:
